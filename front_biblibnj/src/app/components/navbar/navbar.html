<header class="navbar-header">
  <div class="navbar-container">

    <a routerLink="/livros" class="navbar-brand" (click)="fecharMenu()">
      <span class="brand-icon">📚</span>
      <span class="brand-name">biblibnj</span>
    </a>

    <button 
      class="hamburger-btn" 
      (click)="toggleMenu()" 
      [class.active]="menuAberto"
      aria-label="Alternar menu de navegação">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav-links" [class.open]="menuAberto">
      <a 
        routerLink="/livros" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="fecharMenu()">
        Catálogo
      </a>

      <ng-container *ngIf="authService.isLoggedIn()">
        <ng-container *ngIf="!authService.isAdmin()">
          <a 
            routerLink="/emprestimos/meus-emprestimos" 
            routerLinkActive="active" 
            (click)="fecharMenu()">
            Meus Empréstimos
          </a>

          <a 
            routerLink="/emprestimos/fila-espera" 
            routerLinkActive="active" 
            (click)="fecharMenu()">
            Fila de Espera
          </a>
        </ng-container>

        <ng-container *ngIf="authService.isAdmin()">
          <a 
            routerLink="/admin/gerenciar-emprestimos" 
            routerLinkActive="active" 
            class="admin-link"
            (click)="fecharMenu()">
            Gerenciar Empréstimos
          </a>

          <a 
            routerLink="/admin/livros/novo" 
            routerLinkActive="active" 
            class="admin-link"
            (click)="fecharMenu()">
             Novo Livro
          </a>
        </ng-container>
      </ng-container>

      <div class="mobile-user-actions">
        <ng-container *ngIf="authService.isLoggedIn(); else mobileLoggedOut">
          <span class="mobile-user-name">👤 {{ authService.usuarioAtual() }}</span>
          <a routerLink="/conta/alterar-senha" class="mobile-change-pass" (click)="fecharMenu()">Alterar Senha</a>
          <button (click)="logout()" class="btn-logout-mobile">Sair</button>
        </ng-container>
        <ng-template #mobileLoggedOut>
          <a routerLink="/login" class="btn-login-mobile" (click)="fecharMenu()">Entrar</a>
        </ng-template>
      </div>
    </nav>

    <div class="user-actions-desktop">
      <ng-container *ngIf="authService.isLoggedIn(); else desktopLoggedOut">
        <span 
          class="role-badge" 
          [class.badge-admin]="authService.isAdmin()">
          {{ authService.isAdmin() ? 'Admin' : 'Leitor' }}
        </span>

        <div class="user-profile">
          <span class="user-avatar">👤</span>
          <span class="user-name">{{ authService.usuarioAtual() }}</span>
        </div>

        <a routerLink="/conta/alterar-senha" class="btn-change-pass" title="Alterar senha">🔑</a>

        <button (click)="logout()" class="btn-logout" title="Encerrar sessão">
          Sair 🚪
        </button>
      </ng-container>

      <ng-template #desktopLoggedOut>
        <a routerLink="/login" class="btn-login">Entrar</a>
      </ng-template>
    </div>
  </div>
</header>
