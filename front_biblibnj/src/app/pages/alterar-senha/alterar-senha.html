<div class="login-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">🔒</div>
      <h2>Alterar Senha</h2>
      <p>Defina uma nova senha para sua conta.</p>
    </div>

    <div *ngIf="mensagemErro" class="alert-error">
      <span>⚠️</span> {{ mensagemErro }}
    </div>

    <div *ngIf="mensagemSucesso" class="alert-success">
      <p>{{ mensagemSucesso }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="senhaAtual">Senha atual</label>
        <div class="input-icon-wrapper">
          <span class="icon">🔒</span>
          <input 
            type="password" 
            id="senhaAtual" 
            formControlName="senhaAtual" 
            placeholder="Sua senha atual"
            [class.is-invalid]="f['senhaAtual'].invalid && (f['senhaAtual'].touched || f['senhaAtual'].dirty)"
          />
        </div>
        <div *ngIf="f['senhaAtual'].invalid && (f['senhaAtual'].touched || f['senhaAtual'].dirty)" class="error-feedback">
          <small *ngIf="f['senhaAtual'].errors?.['required']">Informe sua senha atual.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova senha</label>
        <div class="input-icon-wrapper">
          <span class="icon">🔒</span>
          <input 
            type="password" 
            id="novaSenha" 
            formControlName="novaSenha" 
            placeholder="Crie uma nova senha"
            [class.is-invalid]="f['novaSenha'].invalid && (f['novaSenha'].touched || f['novaSenha'].dirty)"
          />
        </div>
        <div *ngIf="f['novaSenha'].invalid && (f['novaSenha'].touched || f['novaSenha'].dirty)" class="error-feedback">
          <small *ngIf="f['novaSenha'].errors?.['required']">A nova senha é obrigatória.</small>
          <small *ngIf="f['novaSenha'].errors?.['minlength']">A nova senha deve ter no mínimo 6 caracteres.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar nova senha</label>
        <div class="input-icon-wrapper">
          <span class="icon">🔒</span>
          <input 
            type="password" 
            id="confirmarSenha" 
            formControlName="confirmarSenha" 
            placeholder="Repita a nova senha"
            [class.is-invalid]="f['confirmarSenha'].invalid && (f['confirmarSenha'].touched || f['confirmarSenha'].dirty)"
          />
        </div>
        <div *ngIf="form.errors?.['senhasDiferentes'] && (f['confirmarSenha'].touched || f['confirmarSenha'].dirty)" class="error-feedback">
          <small>As senhas não coincidem.</small>
        </div>
      </div>

      <button type="submit" [disabled]="form.invalid || carregando" class="btn-submit">
        <span *ngIf="!carregando">Alterar Senha</span>
        <span *ngIf="carregando">Salvando...</span>
      </button>
    </form>
  </div>
</div>
